name: Deploy NSE Platform Artifacts

# TRIGGER: run only when code lands on main
on:
  push:
    branches: [main]

# PERMISSIONS: required for OIDC — the runner needs to request a token
permissions:
  id-token: write      # lets the runner fetch the GitHub OIDC token
  contents: read       # lets the runner check out your repo

jobs:
  build-and-publish:
    runs-on: ubuntu-latest 

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: nse-ingest
      S3_BUCKET: nse-platform
      S3_ARTIFACT_PREFIX: artifacts

    steps:
      # 1. Pull repo onto the empty runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Build the wheel, capture its filename
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          echo "WHEEL_FILE=$(basename dist/*.whl)" >> $GITHUB_ENV

      # 4. Assume the AWS role via OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::978942695091:role/nse-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      # 5. Upload the wheel to s3
      - name: Upload wheel to S3
        run: |
          aws s3 cp dist/*.whl s3://${{ env.S3_BUCKET }}/${{ env.S3_ARTIFACT_PREFIX }}/
      
      # 5b. Sync Glue entry scripts to S3
      - name: Upload Glue scripts to S3
        run: |
          aws s3 cp glue_entry/ s3://${{ env.S3_BUCKET }}/${{ env.S3_ARTIFACT_PREFIX }}/glue_entry/ --recursive

      # 5c. Sync DAG files to S3
      - name: Upload DAGs to S3
        run: |
          aws s3 cp airflow/dags/ s3://${{ env.S3_BUCKET }}/dags/ --recursive

      # 6. Log in to ECR
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Build the Lambda image, push, capture its digest
      - name: Build and push Lambda image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            --provenance=false \
            -f Dockerfile.lambda \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest)
          echo "IMAGE_URI=$DIGEST" >> $GITHUB_ENV

      # 8. Create Lambda functions if they don't exist yet, otherwise update their image
      - name: Deploy Lambda functions
        run: |
          for FN in nse-equity-ingest-Function nse-index-ingest-Function; do
            if aws lambda get-function --function-name "$FN" >/dev/null 2>&1; then
              echo "Function $FN exists — updating image"
              aws lambda update-function-code \
                --function-name "$FN" \
                --image-uri ${{ env.IMAGE_URI }}
            else
              echo "Function $FN does not exist — creating"
              if [ "$FN" = "nse-equity-ingest-Function" ]; then
                HANDLER="lambda_entry.equity_ingest_handler.handler"
              else
                HANDLER="lambda_entry.index_ingest_handler.handler"
              fi
              aws lambda create-function \
                --function-name "$FN" \
                --package-type Image \
                --code ImageUri=${{ env.IMAGE_URI }} \
                --role arn:aws:iam::978942695091:role/nse-ingest-role \
                --timeout 120 \
                --memory-size 256 \
                --architectures x86_64 \
                --image-config "Command=$HANDLER" \
                --ephemeral-storage "Size=512"
            fi
          done

      # 9. Point every Glue job at the wheel thats just built
      - name: Update Glue jobs to new wheel
        run: |
          for job in bronzeEquity BronzeIndex silverEquity silverIndex goldJob; do
            aws glue get-job --job-name "$job" --query "Job" --output json > /tmp/full.json
            jq --arg wheel "s3://${{ env.S3_BUCKET }}/${{ env.S3_ARTIFACT_PREFIX }}/${{ env.WHEEL_FILE }}" '
              .DefaultArguments["--additional-python-modules"] = $wheel
              | del(.Name, .CreatedOn, .LastModifiedOn, .AllocatedCapacity, .JobMode, .JobRunQueuingEnabled, .MaxCapacity)
            ' /tmp/full.json > /tmp/updated.json
            aws glue update-job --job-name "$job" --job-update "$(cat /tmp/updated.json)"
          done