[project]
name = "nse-platform"
version = "0.1.1"
description = "NSE equity and index data platform"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    "boto3",
]

[project.optional-dependencies]

spark = [
    "pyspark==4.1.2",
    "delta-spark==4.1.0",
]

dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]